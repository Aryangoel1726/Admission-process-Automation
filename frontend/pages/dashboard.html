<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — AdmissionPro</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    /* Dashboard-specific styles — TODO: move to separate CSS file */
    .dashboard {
      padding: 40px 20px;
      min-height: 80vh;
    }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .welcome-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--secondary);
    }
    .app-card {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .app-info h4 { margin-bottom: 4px; color: var(--secondary); }
    .app-info p { color: var(--text-light); font-size: 0.9rem; }
    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-draft { background: #f1f5f9; color: #475569; }
    .status-submitted { background: #dbeafe; color: #2563eb; }
    .status-under_review { background: #fef3c7; color: #d97706; }
    .status-approved { background: #dcfce7; color: #16a34a; }
    .status-rejected { background: #fef2f2; color: #dc2626; }
    .status-waitlisted { background: #f3e8ff; color: #9333ea; }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-light);
    }
    .empty-state h3 { margin-bottom: 8px; color: var(--secondary); }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo">🎓 AdmissionPro</a>
      <ul class="nav-links">
        <li><a href="dashboard.html" class="active">Dashboard</a></li>
        <li><a href="programs.html">Programs</a></li>
        <li><button onclick="logout()" class="btn btn-outline" style="cursor:pointer;">Logout</button></li>
      </ul>
    </div>
  </nav>

  <!-- Dashboard Content -->
  <section class="dashboard">
    <div class="container" style="max-width:900px;">
      <div class="dashboard-header">
        <div>
          <p class="welcome-text" id="welcomeText">Welcome back!</p>
          <p style="color:var(--text-light);">Here are your admission applications.</p>
        </div>
        <!-- TODO: Add "New Application" button that opens application form -->
      </div>

      <div id="applicationsList">
        <!-- Applications will be loaded here dynamically -->
        <div class="empty-state">
          <h3>Loading...</h3>
        </div>
      </div>
    </div>
  </section>

  <script src="../js/app.js"></script>
  <script>
    // Dashboard initialization
    document.addEventListener('DOMContentLoaded', async () => {
      if (!isLoggedIn()) {
        window.location.href = 'login.html';
        return;
      }

      const user = getUser();
      if (user) {
        document.getElementById('welcomeText').textContent = `Welcome, ${user.firstName}!`;
      }

      // Load applications
      try {
        const res = await apiRequest('/applications/my');
        const container = document.getElementById('applicationsList');

        if (res.data.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <h3>No applications yet</h3>
              <p>You haven't submitted any applications. Browse programs to get started.</p>
              <br />
              <a href="programs.html" class="btn btn-primary">Browse Programs</a>
            </div>
          `;
          return;
        }

        container.innerHTML = res.data
          .map(
            (app) => `
            <div class="app-card">
              <div class="app-info">
                <h4>${app.program}</h4>
                <p>Academic Year: ${app.academicYear} &bull; Applied: ${new Date(app.createdAt).toLocaleDateString()}</p>
              </div>
              <span class="status-badge status-${app.status}">${app.status.replace('_', ' ')}</span>
            </div>
          `
          )
          .join('');
      } catch (err) {
        document.getElementById('applicationsList').innerHTML = `
          <div class="empty-state">
            <h3>Could not load applications</h3>
            <p>${err.message}</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
