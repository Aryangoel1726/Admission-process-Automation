<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AdmissionPro</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo">🎓 AdmissionPro</a>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="programs.html">Programs</a></li>
        <li><a href="register.html" class="btn btn-primary">Register</a></li>
      </ul>
    </div>
  </nav>

  <!-- Login Form -->
  <section class="form-page">
    <div class="form-container">
      <h2>Welcome Back</h2>
      <p class="subtitle">Login to your admission portal</p>

      <div id="formAlert" class="alert alert-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="aryan@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>

        <!-- TODO: Add "Forgot Password?" link -->

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">
          Login →
        </button>
      </form>

      <p style="text-align:center; margin-top:16px; color:var(--text-light);">
        Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:600;">Register</a>
      </p>
    </div>
  </section>

  <script src="../js/app.js"></script>
</body>
</html>
