<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — AdmissionPro</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo">🎓 AdmissionPro</a>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="programs.html">Programs</a></li>
        <li><a href="login.html" class="btn btn-outline">Login</a></li>
      </ul>
    </div>
  </nav>

  <!-- Registration Form -->
  <section class="form-page">
    <div class="form-container">
      <h2>Create Account</h2>
      <p class="subtitle">Start your admission journey today</p>

      <div id="formAlert" class="alert alert-error"></div>

      <form id="registerForm">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Aryan" required />
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Goel" required />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="aryan@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Min 6 characters" minlength="6" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="9876543210" pattern="\d{10}" required />
          </div>
          <div class="form-group">
            <label for="dateOfBirth">Date of Birth</label>
            <input type="date" id="dateOfBirth" name="dateOfBirth" required />
          </div>
        </div>

        <div class="form-group">
          <label for="gender">Gender</label>
          <select id="gender" name="gender" required>
            <option value="" disabled selected>Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">
          Register →
        </button>
      </form>

      <p style="text-align:center; margin-top:16px; color:var(--text-light);">
        Already have an account? <a href="login.html" style="color:var(--primary); font-weight:600;">Login</a>
      </p>
    </div>
  </section>

  <script src="../js/app.js"></script>
</body>
</html>
